<!-- Menú lateral -->
<div class="md:col-span-1">
  <div class="flex flex-col">
    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.routerLink"
      routerLinkActive=" border-orange-400 text-orange-400 px-1"
      class="border-l-1 border-gray-400 px-4 hover:text-orange-400 hover:border-orange-400 transition-colors py-2"
    >
      <i class="{{ item.icon }} mr-2"></i> {{ item.label }}
    </a>
  </div>
</div>
