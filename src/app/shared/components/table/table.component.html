<div class="card">
  <p-table
    #dt2
    [value]="dataSource"
    dataKey="id"
    [rows]="10"
    [rowsPerPageOptions]="[10, 25, 50]"
    [loading]="loading"
    [paginator]="true"
    [globalFilterFields]="getGlobalFilterFields()"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]="selected" dataKey="code"
  >
    <!-- Cabecera y búsqueda global (se mantienen igual) -->

    <ng-template pTemplate="header">
      <tr>
        <th style="width: 4rem"><p-tableHeaderCheckbox /></th>
        <th *ngFor="let col of columns" [style.width]="col.width">
          {{ col.header }}
        </th>
      </tr>
      <tr>
        <th *ngFor="let col of columns">
          <ng-container [ngSwitch]="col.filterType">
            <!-- Filtro de texto estándar -->
            <p-columnFilter
              *ngSwitchCase="'text'"
              type="text"
              [field]="col.field"
              [placeholder]="'Buscar por ' + col.header"
            ></p-columnFilter>

            <!-- Filtro para estado -->
            <p-columnFilter
              *ngSwitchCase="'status'"
              [field]="col.field"
              matchMode="equals"
              [showMenu]="false"
            >
              <ng-template pTemplate="filter" let-value let-filter="filterCallback">
                <p-select
                  [options]="statusOptions"
                  (onChange)="filter($event.value)"
                  placeholder="Filtrar estado"
                  [showClear]="true"
                >
                  <ng-template let-option pTemplate="item">
                    <p-tag [value]="option" [severity]="getStatusSeverity(option)"></p-tag>
                  </ng-template>
                </p-select>
              </ng-template>
            </p-columnFilter>

            <!-- Filtro booleano -->
            <p-columnFilter
              *ngSwitchCase="'boolean'"
              type="boolean"
              [field]="col.field"
            ></p-columnFilter>

            <!-- Filtro por defecto (para columnas sin filtro específico) -->
            <p-columnFilter
              *ngSwitchDefault
              type="text"
              [field]="col.field"
              [placeholder]="'Buscar por ' + col.header"
            ></p-columnFilter>
          </ng-container>
        </th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-item>
      <tr>
        <td *ngFor="let col of columns">
          <ng-container [ngSwitch]="col.type">
            <!-- Texto simple -->
            <ng-container *ngSwitchCase="'text'">
              {{ item[col.field] }}
            </ng-container>

            <!-- Imagen -->
            <ng-container *ngSwitchCase="'image'">
              <img
                [src]="item[col.field]"
                [alt]="item['title'] || 'Imagen'"
                class="w-20 h-20 object-cover rounded shadow"
                (click)="openImagePreview(item[col.field])"
                style="cursor: pointer"
              >
            </ng-container>

            <!-- Estado con tag -->
            <ng-container *ngSwitchCase="'status'">
              <p-tag
                [value]="item[col.field]"
                [severity]="getStatusSeverity(item[col.field])"
                class="uppercase"
              ></p-tag>
            </ng-container>

            <!-- Categoría con tag -->
            <ng-container *ngSwitchCase="'tag'">
              <p-tag [value]="item[col.field]" severity="info"></p-tag>
            </ng-container>

            <!-- Booleano -->
            <ng-container *ngSwitchCase="'boolean'">
              <i
                class="pi"
                [ngClass]="{
                  'text-green-500 pi-check-circle': item[col.field],
                  'text-red-500 pi-times-circle': !item[col.field]
                }"
              ></i>
            </ng-container>
          </ng-container>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage" let-product>
      <tr>
        <td>
          <p-tableCheckbox [value]="product" />
      </td>
        <td [attr.colspan]="columns.length" class="text-center py-8">
          <i class="pi pi-image text-4xl text-gray-400 mb-2"></i>
          <p class="text-gray-500">No se encontraron registros</p>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
