<div class="card">
  <p-table
    [value]="customers"
    [paginator]="true"
    [rows]="5"
    [tableStyle]="{ 'min-width': '50rem' }"
    [rowsPerPageOptions]="[5, 10, 20]"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="createAt" style="width: 20%">
          Fecha <p-sortIcon field="createAt" />
        </th>
        <th pSortableColumn="name" style="width: 20%">
          Nombre <p-sortIcon field="name" />
        </th>
        <th pSortableColumn="category" style="width: 20%">
          Categoría <p-sortIcon field="category" />
        </th>
        <th pSortableColumn="amount" style="width: 20%">
          Cantidad <p-sortIcon field="amount" />
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-product>
      <tr
        (click)="onRowSelect(product)"
        [pSelectableRow]="product"
        [pSelectableRowIndex]="product.id"
        [ngClass]="rowClass(product)"
        [ngClass]="rowClass(product)"
        (mouseover)="hoveredRow = product"
        (mouseleave)="hoveredRow = null"
      >
        <td>{{ product.createAt | customDate }}</td>
        <td>{{ product.name }}</td>
        <td>
          {{
            product.category
              | valueToLabel : incomesBillsConstans.category.option
          }}
        </td>
        <td>€{{ product.amount | numberFormat }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
<p-dialog header="Edit Profile" [modal]="true" [(visible)]="visible"  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [maximizable]="true">
  <span class="p-text-secondary block mb-8">Update your information.</span>
  <div class="flex items-center gap-4 mb-4">
      <label for="username" class="font-semibold w-24">Username</label>
      <input pInputText id="username" class="flex-auto" autocomplete="off" />
  </div>
  <div class="flex items-center gap-4 mb-8">
      <label for="email" class="font-semibold w-24">Email</label>
      <input pInputText id="email" class="flex-auto" autocomplete="off" />
  </div>
</p-dialog>
