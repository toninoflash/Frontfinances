<div class="flex space-x-4 overflow-x-auto pb-2  justify-center">
  <div class="flex flex-col items-center min-w-[80px]" *ngFor="let item of items?.slice(0,limit)">
    <img [src]="item.avatarUrl" class="w-16 h-16 rounded-full border-2 border-orange-400" />
    <span class="text-sm mt-1 text-center">{{ item.username }}</span>
  </div>
</div>
