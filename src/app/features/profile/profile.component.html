<div class="grid grid-cols-1 md:grid-cols-5 gap-4 p-4">
  <!-- Menú lateral -->
  <div class="md:col-span-1">
  <app-menu-left [menuItems]="menuItems"></app-menu-left>
</div>

  <!-- Contenido principal del perfil -->
  <div class="md:col-span-4 profile-container">
    <!-- Tarjeta principal de perfil -->
    <p-card styleClass="shadow-sm" class="mb-4">
      <!-- Parte superior: avatar, nombre, botones -->
      <div class="flex flex-col md:flex-row items-center md:items-start justify-between gap-4">
        <div class="flex flex-col md:flex-row items-center gap-4 flex-1">
          <p-avatar [image]="resp.avatarUrl" size="xlarge" shape="circle"></p-avatar>
          <div class="text-center md:text-left">
            <h2 class="text-2xl font-semibold">{{resp.name}} {{ resp.lastname}}</h2>
            <p class="text-gray-500">{{resp.username}}</p>
          </div>
        </div>
        <div class="flex gap-2">
          <button pButton label="Editar perfil" icon="pi pi-user-edit" class="p-button-sm p-button-outlined p-button-text" (click)="showDialog()"></button>
          <button pButton label="Ajustes" icon="pi pi-cog" class="p-button-sm p-button-secondary p-button-outlined p-button-text"></button>
        </div>
      </div>

      <!-- Parte inferior: datos adicionales -->
      <div class="mt-6 text-sm text-gray-500 grid md:grid-cols-2 gap-6">
        <div class="flex items-center gap-2">
          <i class="pi pi-envelope text-lg text-gray-400"></i>
          <span><strong>Email:</strong> {{resp.email}}</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="pi pi-phone text-lg text-gray-400"></i>
          <span><strong>Teléfono:</strong> {{resp.phone}}</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="pi pi-map text-lg text-gray-400"></i>
          <span><strong>Dirección:</strong> {{resp.direction}}</span>
        </div>
        <div class="flex items-center gap-2">
          <i class="pi pi-globe text-lg text-gray-400"></i>
          <span><strong>Web:</strong> <a [href]="resp.website" target="_blank" class="text-blue-500 hover:underline">{{resp.website}}</a></span>
        </div>
      </div>
      <div class="mt-6 text-sm text-gray-500 grid md:grid-cols-2 gap-6">
        <div class="flex items-center gap-2">
          <i class="pi pi-calendar text-lg text-gray-400"></i>
          <span><strong>Bio:</strong> {{resp.bio }}</span>
        </div> </div>
    </p-card>


    <!-- Estadísticas o resumen de actividad -->
    <div class="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
      <p-card>
        <div class="text-center">
          <h3 class="text-lg font-medium">Seguidores</h3>
          <p class="text-2xl font-bold text-primary">1.245</p>
        </div>
      </p-card>

      <p-card>
        <div class="text-center">
          <h3 class="text-lg font-medium">Proyectos</h3>
          <p class="text-2xl font-bold text-primary">12</p>
        </div>
      </p-card>

      <p-card>
        <div class="text-center">
          <h3 class="text-lg font-medium">Puntuación</h3>
          <p class="text-2xl font-bold text-primary">4.8 ★</p>
        </div>
      </p-card>
    </div>
  </div>
</div>
<p-dialog header="Edit Profile" [modal]="true" [(visible)]="visible" >
  <app-dynamic-form
      [formData]="dynamicGroup"
      (formGroupChange)="onFormGroupChange($event)"
    ></app-dynamic-form>
</p-dialog>
