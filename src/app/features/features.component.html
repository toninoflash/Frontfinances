<div class="layout">
  <!-- HEADER -->
  <app-header class="fixed top-0 left-0 w-full z-50"></app-header>

  <div class="main-container">
    <!-- SIDEBAR -->
    <p-sidebar [(visible)]="sidebarVisible" position="left" [modal]="true" [baseZIndex]="10000">
      <p-panelMenu [model]="sideMenuItems"></p-panelMenu>
    </p-sidebar>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container mt-16 text-align: left;">


      <app-breadcrumb></app-breadcrumb>

      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- FOOTER -->
  <app-footer></app-footer>
</div>
