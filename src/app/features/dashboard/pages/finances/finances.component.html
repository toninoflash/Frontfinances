<h2 class="text-2xl font-bold mb-4">Dashboard</h2>
      <p>Bienvenido al panel de control. Aquí puedes ver tus ingresos, gastos y más.</p>

      <!-- Ejemplo de contenido adicional -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6">
        <p-card class="summary-card income-card">
          <ng-template pTemplate="title">
            <i class="pi pi-dollar text-green-500"></i> Ingresos
          </ng-template>
          <ng-template pTemplate="content">
            <h2 class="text-green-500 text-2xl font-bold">$12,345</h2>
            <p class="text-sm text-gray-500">Este mes</p>
          </ng-template>
        </p-card>

        <p-card class="summary-card expense-card">
          <ng-template pTemplate="title">
            <i class="pi pi-shopping-cart text-red-500"></i> Gastos
          </ng-template>
          <ng-template pTemplate="content">
            <h2 class="text-red-500 text-2xl font-bold">$8,765</h2>
            <p class="text-sm text-gray-500">Este mes</p>
          </ng-template>
        </p-card>

        <p-card class="summary-card savings-card">
          <ng-template pTemplate="title">
            <i class="pi pi-wallet text-blue-500"></i> Ahorros
          </ng-template>
          <ng-template pTemplate="content">
            <h2 class="text-blue-500 text-2xl font-bold">$3,580</h2>
            <p class="text-sm text-gray-500">Este mes</p>
          </ng-template>
        </p-card>
      </div>
