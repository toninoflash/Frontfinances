<h2 class="text-2xl font-bold mb-4">{{title}}</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 ">
  <p-card class="summary-card income-card">
    <ng-template pTemplate="title">
      <i class="pi pi-dollar text-green-500"></i> Ingresos
    </ng-template>
    <ng-template pTemplate="content">
      <h2 class="text-green-500 text-2xl font-bold">$12,345</h2>
      <p class="text-sm text-gray-500">Este mes</p>
    </ng-template>
  </p-card>

  <p-card class="summary-card expense-card">
    <ng-template pTemplate="title">
      <i class="pi pi-shopping-cart text-red-500"></i> Gastos
    </ng-template>
    <ng-template pTemplate="content">
      <h2 class="text-red-500 text-2xl font-bold">$8,765</h2>
      <p class="text-sm text-gray-500">Este mes</p>
    </ng-template>
  </p-card>

  <p-card class="summary-card savings-card">
    <ng-template pTemplate="title">
      <i class="pi pi-wallet text-blue-500"></i> Ahorros
    </ng-template>
    <ng-template pTemplate="content">
      <h2 class="text-blue-500 text-2xl font-bold">$3,580</h2>
      <p class="text-sm text-gray-500">Este mes</p>
    </ng-template>
  </p-card>
</div>
<p-card class="summary-card savings-card" [style]="{'margin-top': '1rem'}">

  <p-multiselect  [options]="items" optionLabel="name" [maxSelectedLabels]="3" styleClass="w-full md:w-80 me-6" size="small" placeholder="Movimientos"/>
  <p-multiselect  [options]="categories" optionLabel="name" [maxSelectedLabels]="3" styleClass="w-full md:w-80 me-6" size="small" placeholder="Categorias" />
  <p-multiselect  [options]="periodos" optionLabel="name" [maxSelectedLabels]="3" styleClass="w-full md:w-80 me-6" size="small" placeholder="Periodos" />
  <p-button label="Submit" size="small"/>
</p-card>

<p-card [style]="{'margin-top': '1rem'}">
  <app-table></app-table>
</p-card>
