<h2 class="text-2xl font-bold mb-4">{{title}}</h2>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 ">
  <p-card >
    <ng-template pTemplate="title">
      <i class="pi pi-dollar text-green-500"></i> Ingresos
    </ng-template>
    <ng-template pTemplate="content">
      <h2 class="text-green-500 text-2xl font-bold">€{{totalIncome | numberFormat}}</h2>
      <p class="text-sm text-gray-500">Este mes</p>
    </ng-template>
  </p-card>

  <p-card class="summary-card expense-card">
    <ng-template pTemplate="title">
      <i class="pi pi-shopping-cart text-red-500"></i> Gastos
    </ng-template>
    <ng-template pTemplate="content">
      <h2 class="text-red-500 text-2xl font-bold">€{{totalBills | numberFormat}}</h2>
      <p class="text-sm text-gray-500">Este mes</p>
    </ng-template>
  </p-card>

  <p-card class="summary-card savings-card">
    <ng-template pTemplate="title">
      <i class="pi pi-wallet text-blue-500"></i> Ahorros
    </ng-template>
    <ng-template pTemplate="content">
      <h2 class="text-blue-500 text-2xl font-bold">$3,580</h2>
      <p class="text-sm text-gray-500">Este mes</p>
    </ng-template>
  </p-card>
</div>
<p-card class="summary-card savings-card" [style]="{'margin-top': '1rem'}">

  <p-multiselect
  [options]="items"
  [(ngModel)]="selectedItems"
  optionLabel="label"
  optionValue="value"
  [maxSelectedLabels]="3"
  styleClass="w-full md:w-80 me-6"
  size="small"
  placeholder="Movimientos"
></p-multiselect>

<p-multiselect
  [options]="categories"
  [(ngModel)]="selectedCategories"
  optionLabel="label"
  optionValue="value"
  [maxSelectedLabels]="3"
  styleClass="w-full md:w-80 me-6"
  size="small"
  placeholder="Categorias"
></p-multiselect>

<p-multiselect
  [options]="periodos"
  [(ngModel)]="selectedPeriodos"
  optionLabel="label"
  optionValue="value"
  [maxSelectedLabels]="3"
  styleClass="w-full md:w-80 me-6"
  size="small"
  placeholder="Periodos"
></p-multiselect>

<p-button label="Filtrar" size="small" (click)="filterDataSource()" class="text-end"></p-button>
</p-card>

<p-card [style]="{'margin-top': '1rem'}" class="text-end">
  <app-dialog-button [dynamicGroup]="dynamicGroup" title="Nuevo" (onSubmit)="submitForm($event)" class="text-start"></app-dialog-button>
  <p-toast />
  <app-table [dataSource]="filteredDataSource" [dynamicGroup]="dynamicUpdateGroup"></app-table>
</p-card>
