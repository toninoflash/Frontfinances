<div class="flex h-screen">
  <!-- Menú a la izquierda -->
  <div class="hidden md:block md:w-1/6 lg:w-1/8 shadow-md">
    <app-menu-left [items]="items"></app-menu-left>
  </div>
  <!-- Contenido principal a la derecha -->
  <div class="flex-1 px-6">
    <app-menu-top [items]="items" class="block md:hidden"></app-menu-top>
    <div class="card" >
      <app-finances *ngIf="page === 0"></app-finances>
      <app-incomes-bills *ngIf="page === 1"></app-incomes-bills>

    </div>
  </div>
</div>
