<p-toast />
    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button label="New" icon="pi pi-plus" class="mr-2" (click)="this.showDialog()"/>
            <p-button severity="danger" label="Delete" icon="pi pi-trash" outlined  [disabled]="!selected || !selected.length" />
        </ng-template>

        <ng-template #end>
            <p-fileUpload mode="basic" accept="image/*" [maxFileSize]="1000000" label="Import" chooseLabel="Import" auto customUpload class="mr-2 inline-block" [chooseButtonProps]="{ severity: 'secondary' }" />
            <p-button label="Export" icon="pi pi-upload" severity="secondary"/>
        </ng-template>
    </p-toolbar>
<app-table
  [dataSource]="artworks"
  [label]="label"
  [statuses]="statuses"
  [columns]="artworkColumns"
  (selectedChange)="onSelectedChange($event)"
  (editChange)="onEditChange($event)"
  (deleteChange)="onDeleteChange($event)"
  >
</app-table>
<p-toast />

<p-dialog header="Obra" [modal]="true" [(visible)]="visible" (onHide)="clearPreview()">
  <div class="card flex flex-col gap-6 items-center justify-center bg-gray-100 rounded p-2">
    <div *ngIf="isLoading" class="mt-4">
      <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s" [style]="{ width: '50px', height: '50px' }" />
    </div>
    <div *ngIf="previewImage" class="mt-4">
      <img [src]="previewImage" alt="Preview" style="max-width: 100%; max-height: 300px;" />
    </div>
    <p-fileupload
      #fu
      mode="basic"
      chooseLabel="Archivo"
      chooseIcon="pi pi-upload"
      name="demo[]"
      url="https://www.primefaces.org/cdn/api/upload.php"
      accept="image/*"
      maxFileSize="1000000"
      (onSelect)="onSelectFile($event)"
    />

  </div>
<div class="py-4">
  <app-dynamic-form
  [formData]="dynamicGroup"
  (formGroupChange)="onFormGroupChange($event)"
></app-dynamic-form>

<div style="display: flex; justify-content: flex-end;">
  <p-button
    label="Aceptar"
    class="p-button-sm p-button-outlined"
    (click)="onUpload()"
    [disabled]="!dynamicForm.valid"
    [loading]="isLoading"
    [loadingIcon]="'pi pi-spinner'"
    >
  </p-button>
</div>
</div>

</p-dialog>
