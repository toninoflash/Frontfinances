<p-menubar [model]="menuItems" />
<app-table
  [dataSource]="artworks"
  [label]="label"
  [statuses]="statuses"
  [columns]="artworkColumns"
  >
</app-table>
<p-toast />

<p-dialog header="Obra" [modal]="true" [(visible)]="visible" (onHide)="clearPreview()">
  <div class="card flex flex-col gap-6 items-center justify-center bg-gray-100 rounded p-2">
    <div *ngIf="isLoading" class="mt-4">
      <p-progress-spinner strokeWidth="8" fill="transparent" animationDuration=".5s" [style]="{ width: '50px', height: '50px' }" />
    </div>
    <div *ngIf="previewImage" class="mt-4">
      <img [src]="previewImage" alt="Preview" style="max-width: 100%; max-height: 300px;" />
    </div>
    <p-fileupload
      #fu
      mode="basic"
      chooseLabel="Archivo"
      chooseIcon="pi pi-upload"
      name="demo[]"
      url="https://www.primefaces.org/cdn/api/upload.php"
      accept="image/*"
      maxFileSize="1000000"
      (onSelect)="onSelectFile($event)"
    />

  </div>
<div class="py-4">
  <app-dynamic-form
  [formData]="dynamicGroup"
  (formGroupChange)="onFormGroupChange($event)"
></app-dynamic-form>

<p-button label="Upload" (click)="onUpload()" severity="secondary" />
</div>

</p-dialog>
