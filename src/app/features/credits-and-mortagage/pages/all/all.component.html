<h2 class="text-2xl font-bold mb-4 text-gray-600">{{ title }}</h2>

<div class=" mt-4">
  <p-card>

    <p-card class="summary-card savings-card" [style]="{'margin-top': '1rem'}">

      <p-multiselect
      [options]="items"
      [(ngModel)]="selectedItems"
      optionLabel="label"
      optionValue="value"
      [maxSelectedLabels]="3"
      styleClass="w-full md:w-80 me-6"
      size="small"
      placeholder="Movimientos"
    ></p-multiselect>

    <p-multiselect
      [options]="categories"
      [(ngModel)]="selectedCategories"
      optionLabel="label"
      optionValue="value"
      [maxSelectedLabels]="3"
      styleClass="w-full md:w-80 me-6"
      size="small"
      placeholder="Categorias"
    ></p-multiselect>

    <p-multiselect
      [options]="periodos"
      [(ngModel)]="selectedPeriodos"
      optionLabel="label"
      optionValue="value"
      [maxSelectedLabels]="3"
      styleClass="w-full md:w-80 me-6"
      size="small"
      placeholder="Periodos"
    ></p-multiselect>

    <p-button label="Filtrar" size="small" (click)="filterDataSourceMov()" class="text-end"></p-button>
    </p-card>

    <p-card [style]="{'margin-top': '1rem'}" class="text-end">
      <p-toast />
      <app-table [dataSource]="filteredDataSource" [dynamicGroup]="dynamicUpdateGroup"></app-table>
    </p-card>
  </p-card></div>
